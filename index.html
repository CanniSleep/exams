<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED VS MOAZ: FINAL LAP</title>
    <style>
        :root {
            --bg-color: #0d0e15; --card-bg: #171926;
            --mohamed-color: #00f0ff; --moaz-color: #ff007f;
            --text-color: #f0f1f5; --countdown-color: #ff00ff;
            --success-color: #2ecc71; --danger-color: #e74c3c; 
            --hoq-color: #9b59b6; --qotd-color: #ff3366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; padding-bottom: 150px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* NAVIGATION & HEADER */
        header { text-align: center; margin-bottom: 20px; font-family: 'Impact', sans-serif; }
        h1 { font-size: 3.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .vs { font-style: italic; color: var(--countdown-color); }
        .nav-tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-tab { background: #222; border: 2px solid #555; padding: 10px 25px; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; transition: 0.3s; }
        .nav-tab.active { background: var(--countdown-color); border-color: #fff; }

        .view-section { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; }
        #view-hoq { display: none; }

        /* QUESTION OF THE DAY */
        .qotd-container { background: var(--card-bg); border: 2px solid var(--qotd-color); border-radius: 12px; width: 100%; padding: 20px; margin-bottom: 30px; text-align: center; box-shadow: 0 0 20px rgba(255, 51, 102, 0.2); }
        .qotd-container h2 { color: var(--qotd-color); font-family: 'Impact'; letter-spacing: 1px; margin-bottom: 15px; }
        .qotd-content img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 10px; }
        .qotd-edit { display: none; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px; transition: all 0.3s ease; }
        .qotd-edit.open { display: block; }

        /* LEADERBOARD */
        .leaderboard { background: var(--card-bg); border: 2px solid #333; padding: 20px; width: 100%; border-radius: 12px; margin-bottom: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .board-flex { display: flex; justify-content: space-around; align-items: center; font-size: 2.5rem; font-family: 'Impact'; margin-top: 15px; }
        .score-box { padding: 15px 30px; border-radius: 10px; min-width: 200px; }
        .score-box.mohamed { color: var(--mohamed-color); border: 2px solid var(--mohamed-color); }
        .score-box.moaz { color: var(--moaz-color); border: 2px solid var(--moaz-color); }

        /* ARENA & COLUMNS */
        .arena { display: flex; gap: 30px; width: 100%; flex-wrap: wrap; margin-bottom: 20px; }
        .player-column { flex: 1; min-width: 350px; background: var(--card-bg); border-radius: 15px; padding: 25px; border-top: 5px solid #555; }
        .player-column.mohamed { border-top-color: var(--mohamed-color); }
        .player-column.moaz { border-top-color: var(--moaz-color); }
        
        .player-stats { display: flex; gap: 20px; margin-bottom: 15px; padding: 10px; background: #0d0e15; border-radius: 8px; font-size: 0.9rem; }
        .stat-item { flex: 1; text-align: center; }
        .stat-label { color: #aaa; font-size: 0.8rem; }
        .stat-value { font-weight: bold; color: inherit; }
        
        .todo-form, .wp-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, textarea { background: #25283d; border: 1px solid #444; color: white; padding: 10px; font-size: 1rem; border-radius: 6px; width: 100%; }
        select { background: #25283d; border: 1px solid #444; color: white; padding: 10px; font-size: 1rem; border-radius: 6px; width: 100%; cursor: pointer; }
        select option { background: #25283d; color: white; padding: 8px; }
        select option:hover { background: #3a3d54; }
        button.add-btn { background: #fff; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 6px; flex-shrink: 0; }
        .mohamed .add-btn { background: var(--mohamed-color); }
        .moaz .add-btn { background: var(--moaz-color); }

        /* TASKS */
        .todo-item { background: #202231; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #555; display: flex; flex-direction: column; gap: 10px; }
        .todo-item.completed { border-left-color: var(--success-color); opacity: 0.7; }
        .task-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; }
        .task-controls { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #aaa; }
        .actual-input { width: 70px; padding: 5px; text-align: center; }
        .btn-group { display: flex; gap: 5px; }
        .icon-btn { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-done { background: var(--success-color); }
        .btn-del { background: var(--danger-color); }

        .wp-header { text-align: center; color: #ff3366; font-family: 'Impact'; font-size: 2rem; margin: 30px 0 15px; text-transform: uppercase; }

        /* HALL OF QUESTIONS & QOTD INPUTS */
        .input-box { position: relative; background: #11131c; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: left; }
        .input-box textarea { background: transparent; border: none; min-height: 60px; resize: vertical; outline: none; width: 100%; color: white; }
        .img-preview { display: none; max-height: 150px; margin-top: 10px; border-radius: 6px; }
        .remove-img { display: none; position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.8rem; }
        
        .upload-btn { background: var(--hoq-color); color: white; font-weight: bold; font-size: 1.2rem; padding: 15px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }

        .hoq-upload-card { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; border: 2px dashed var(--hoq-color); margin-bottom: 30px; }
        .hoq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; width: 100%; }
        .hoq-card { background: #202231; padding: 24px; border-radius: 14px; border: 1px solid #444; position: relative; min-height:220px; }
        .hoq-question-title { font-size:1.1rem; font-weight:bold; margin-bottom:10px; }
        .practice-badge { display:inline-block; background:#9b59b6; padding:4px 8px; border-radius:6px; margin-bottom:10px; font-size: 0.8rem; font-weight: bold; }
        .hoq-card img { width: 100%; border-radius: 6px; margin-top: 10px; cursor: pointer; }
        .delete-btn-corner { position: absolute; top: 10px; right: 10px; background: var(--danger-color); border: none; color: white; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 0.8rem; }
        .answer-reveal { background: #111; padding: 10px; border-radius: 6px; margin-top: 10px; display: none; color: #00ffcc; white-space: pre-wrap; }
        .show-ans-btn { background: #444; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }

        /* WIDGETS */
        .widgets-container { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 15px; z-index: 1000; }
        .widget-btn { width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .widget-panel { position: absolute; bottom: 65px; left: 0; background: #fcf3cf; border: 2px solid #d4ac0d; border-radius: 12px; padding: 15px; color: #000; display: none; flex-direction: column; min-width: 250px; }
        .prayer-panel { background: #1a252c; border-color: #00ffcc; color: white; }
        .prayer-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
        .prayer-next { color: #00ffcc; font-weight: bold; margin-top: 10px; text-align: center; }

        /* STOPWATCH */
        .stopwatch-widget { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; align-items: center; }

            border: 3px solid #ff00ff;
            border-radius: 20px;
            padding: 15px 25px;
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: bold;
            color: #0d0e15;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
