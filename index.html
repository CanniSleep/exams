<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED VS MOAZ: THE FINAL LAP</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #171926;
            --mohamed-color: #00f0ff;
            --mohamed-glow: rgba(0, 240, 255, 0.4);
            --moaz-color: #ff007f;
            --moaz-glow: rgba(255, 0, 127, 0.4);
            --text-color: #f0f1f5;
            --countdown-color: #ff00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 1px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            margin-bottom: 5px;
        }

        .vs {
            font-style: italic;
            background: linear-gradient(45deg, var(--mohamed-color), var(--moaz-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding: 0 10px;
        }

        /* COUNTDOWN BANNER */
        .countdown-banner {
            background: linear-gradient(135deg, #1f1135, #0b061f);
            border: 2px dashed var(--countdown-color);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
            text-align: center;
        }

        .countdown-banner h3 {
            font-size: 1.2rem;
            color: #00ffcc;
            font-family: sans-serif;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 10px var(--countdown-color);
            margin-bottom: 15px;
        }

        .see-all-btn {
            background: transparent;
            border: 1px solid var(--countdown-color);
            color: #fff;
            padding: 8px 16px;
            font-family: sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .see-all-btn:hover {
            background: var(--countdown-color);
            box-shadow: 0 0 10px var(--countdown-color);
        }

        .extended-exams {
            display: none;
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-family: sans-serif;
            text-align: left;
        }

        .exam-row {
            background: #221736;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
            border-left: 3px solid #00ffcc;
            display: flex;
            justify-content: space-between;
        }

        /* LEADERBOARD */
        .leaderboard {
            background: var(--card-bg);
            border: 3px solid #333;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .leaderboard h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        .board-flex {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 2.5rem;
            flex-wrap: wrap;
            gap: 15px;
        }

        .score-box {
            padding: 15px 30px;
            border-radius: 10px;
            min-width: 200px;
        }

        .score-box.mohamed { color: var(--mohamed-color); border: 2px solid var(--mohamed-color); box-shadow: 0 0 15px var(--mohamed-glow); }
        .score-box.moaz { color: var(--moaz-color); border: 2px solid var(--moaz-color); box-shadow: 0 0 15px var(--moaz-glow); }

        .day-controls { margin-top: 25px; }

        button.day-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s;
        }
        button.day-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 204, 0, 0.6); }

        /* THE ARENA */
        .arena {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            flex-wrap: wrap;
        }

        .player-column {
            flex: 1;
            min-width: 320px;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .player-column.mohamed { border-top: 8px solid var(--mohamed-color); }
        .player-column.moaz { border-top: 8px solid var(--moaz-color); }

        .player-column h2 { font-size: 2.2rem; margin-bottom: 5px; text-transform: uppercase; }
        .mohamed h2 { color: var(--mohamed-color); }
        .moaz h2 { color: var(--moaz-color); }

        /* STATS BAR */
        .stats-bar {
            background: #11131c;
            padding: 8px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            font-family: sans-serif;
            font-size: 0.9rem;
            color: #bbb;
            border: 1px solid #333;
        }
        .stats-bar strong {
            color: #fff;
        }

        /* INPUT FORMS (MORNING STUDY PLANNER) */
        .todo-form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .todo-form input.task-name { flex: 2; }
        .todo-form input.task-est { flex: 1; }

        .todo-form input {
            background: #25283d;
            border: 2px solid #444;
            color: white;
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
            font-family: sans-serif;
            font-weight: bold;
        }
        .todo-form button {
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 6px;
        }
        .mohamed .todo-form button { background: var(--mohamed-color); }
        .moaz .todo-form button { background: var(--moaz-color); }

        /* TODO LIST RENDERING */
        .todo-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }

        .todo-item {
            background: #202231;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #555;
            gap: 10px;
        }
        .todo-item.checked { border-left-color: #2ecc71 !important; }
        .todo-item.checked .todo-text { opacity: 0.4; text-decoration: line-through; }

        .mohamed .todo-item { border-left-color: var(--mohamed-color); }
        .moaz .todo-item { border-left-color: var(--moaz-color); }

        .todo-info { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
        .todo-text { font-size: 1.2rem; font-family: 'Impact', sans-serif; transition: all 0.2s; }
        
        .time-tracking-row {
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: sans-serif;
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 4px;
        }

        /* END OF DAY ACTUAL TIME BOX INSIDE CARD */
        .actual-input-box {
            background: #11131c;
            border: 1px solid #555;
            color: #fff;
            width: 75px;
            padding: 4px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-family: sans-serif;
            text-align: center;
        }
        .actual-input-box:focus { border-color: #ffd700; outline: none; }

        .todo-actions { display: flex; align-items: center; gap: 8px; }

        .checkbox-btn, .delete-btn {
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .checkbox-btn { background: #2ecc71; }
        .delete-btn { background: #e74c3c; }
        
        .nuke-btn {
            margin-top: 50px;
            background: transparent;
            color: #444;
            border: 1px solid #333;
            padding: 5px 10px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mohamed <span class="vs">VS</span> Moaz</h1>
        <p style="font-family: sans-serif; color: #888; font-weight: bold;">HIGH SCHOOL FINAL MONTH CRUNCH TIME</p>
    </header>

    <!-- EXAM TICKER DISPLAY -->
    <section class="countdown-banner">
        <h3 id="exam-title">INITIALIZING SYSTEM...</h3>
        <div id="timer">00d : 00h : 00m : 00s</div>
        <button class="see-all-btn" onclick="toggleExamsPanel()">📂 See All Exams</button>
        <div class="extended-exams" id="extended-exams-panel"></div>
    </section>

    <!-- LIVE LEADERBOARD CONTAINER -->
    <section class="leaderboard">
        <h2>🔥 OVERALL LEADERBOARD 🔥</h2>
        <div class="board-flex">
            <div class="score-box mohamed">
                <div>MOHAMED</div>
                <div id="score-mohamed">0</div>
            </div>
            <div style="font-size: 1.5rem; color: #555;">VS</div>
            <div class="score-box moaz">
                <div>MOAZ</div>
                <div id="score-moaz">0</div>
            </div>
        </div>
        <div class="day-controls">
            <button class="day-btn" onclick="endTheDay()">🚨 END THE DAY & CALCULATE POINTS 🚨</button>
        </div>
    </section>

    <!-- MAIN INTERACTIVE ARENA -->
    <main class="arena">
        
        <!-- MOHAMED -->
        <div class="player-column mohamed">
            <h2>Mohamed</h2>
            <div class="stats-bar" id="stats-mohamed">
                <span>Total Tasks: <strong>0</strong></span>
                <span>Est Time: <strong>0h 0m</strong></span>
            </div>
            <div class="todo-form">
                <input type="text" id="input-mohamed-task" class="task-name" placeholder="Morning: Add today's task...">
                <input type="number" id="input-mohamed-est" class="task-est" placeholder="Est. Mins" min="1">
                <button onclick="addTodo('mohamed')">ADD</button>
            </div>
            <ul class="todo-list" id="list-mohamed"></ul>
        </div>

        <!-- MOAZ -->
        <div class="player-column moaz">
            <h2>Moaz</h2>
            <div class="stats-bar" id="stats-moaz">
                <span>Total Tasks: <strong>0</strong></span>
                <span>Est Time: <strong>0h 0m</strong></span>
            </div>
            <div class="todo-form">
                <input type="text" id="input-moaz-task" class="task-name" placeholder="Morning: Add today's task...">
                <input type="number" id="input-moaz-est" class="task-est" placeholder="Est. Mins" min="1">
                <button onclick="addTodo('moaz')">ADD</button>
            </div>
            <ul class="todo-list" id="list-moaz"></ul>
        </div>

    </main>

    <button class="nuke-btn" onclick="nukeData()">⚠️ Reset All Data</button>

    <script>
        const exams = [
            { name: "Religion & National Education", date: new Date("2026-06-21T09:00:00").getTime() },
            { name: "Economics & Statistics", date: new Date("2026-06-23T09:00:00").getTime() },
            { name: "Arabic Language", date: new Date("2026-06-28T09:00:00").getTime() },
            { name: "Chemistry", date: new Date("2026-07-02T09:00:00").getTime() },
            { name: "Foreign Language (English)", date: new Date("2026-07-05T09:00:00").getTime() },
            { name: "Physics", date: new Date("2026-07-09T09:00:00").getTime() },
            { name: "Biology", date: new Date("2026-07-16T09:00:00").getTime() }
        ];

        function updateCountdown() {
            const now = new Date().getTime();
            let nextExam = null;
            let otherExams = [];

            for (let exam of exams) {
                if (exam.date > now) {
                    if (!nextExam) {
                        nextExam = exam;
                    } else {
                        otherExams.push(exam);
                    }
                }
            }

            const titleEl = document.getElementById("exam-title");
            const timerEl = document.getElementById("timer");
            const extendedPanel = document.getElementById("extended-exams-panel");

            if (!nextExam) {
                titleEl.innerText = "🎉 FREEDOM! ALL EXAMS ARE COMPLETED! 🎉";
                timerEl.innerText = "00d : 00h : 00m : 00s";
                extendedPanel.innerHTML = "";
                return;
            }

            titleEl.innerText = `NEXT TARGET: ${nextExam.name}`;

            const distance = nextExam.date - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            timerEl.innerText = `${days < 10 ? '0'+days : days}d : ${hours < 10 ? '0'+hours : hours}h : ${minutes < 10 ? '0'+minutes : minutes}m : ${seconds < 10 ? '0'+seconds : seconds}s`;

            extendedPanel.innerHTML = otherExams.map(exam => {
                const diffMs = exam.date - now;
                const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                return `<div class="exam-row"><span>${exam.name}</span><strong>${daysLeft} days left</strong></div>`;
            }).join('');
        }

        function toggleExamsPanel() {
            const panel = document.getElementById("extended-exams-panel");
            panel.style.display = (panel.style.display === "grid") ? "none" : "grid";
        }

        setInterval(updateCountdown, 1000);

        let state;
        try {
            state = JSON.parse(localStorage.getItem('hustleState'));
            if (!state || !state.todos || !Array.isArray(state.todos.mohamed) || !Array.isArray(state.todos.moaz)) throw new Error();
        } catch (e) {
            state = { scores: { mohamed: 0, moaz: 0 }, todos: { mohamed: [], moaz: [] } };
            localStorage.setItem('hustleState', JSON.stringify(state));
        }

        function saveState() {
            localStorage.setItem('hustleState', JSON.stringify(state));
            updateDOM();
        }

        function nukeData() {
            if(confirm("Reset entire scoreboards and wipe current tasks?")) {
                localStorage.removeItem('hustleState');
                location.reload();
            }
        }

        function addTodo(player) {
            const nameInput = document.getElementById(`input-${player}-task`);
            const estInput = document.getElementById(`input-${player}-est`);

            if (!nameInput.value.trim() || !estInput.value) {
                alert("Enter the Task name and an Estimated study duration!");
                return;
            }

            const newTodo = {
                id: Date.now() + Math.floor(Math.random() * 100),
                task: nameInput.value.trim(),
                est: parseInt(estInput.value),
                act: 0, 
                checked: false
            };

            state.todos[player].push(newTodo);
            nameInput.value = '';
            estInput.value = '';
            saveState();
        }

        function toggleTodo(player, id) {
            const todo = state.todos[player].find(t => t.id === id);
            if (todo) {
                todo.checked = !todo.checked;
                saveState();
            }
        }

        function deleteTodo(player, id) {
            state.todos[player] = state.todos[player].filter(t => t.id !== id);
            saveState();
        }

        function updateActualTime(player, id, inputVal) {
            const todo = state.todos[player].find(t => t.id === id);
            if (todo) {
                todo.act = parseInt(inputVal) || 0;
                localStorage.setItem('hustleState', JSON.stringify(state));
            }
        }

        function endTheDay() {
            if (!confirm("Are you ready to submit your actual times and process daily tallies?")) return;

            ['mohamed', 'moaz'].forEach(player => {
                const totalTasks = state.todos[player].length;
                if (totalTasks === 0) {
                    state.scores[player] -= 1; 
                    return;
                }

                const allChecked = state.todos[player].every(t => t.checked);
                
                if (allChecked) {
                    let totalEst = 0;
                    let totalAct = 0;
                    let missedActualLogs = false;

                    state.todos[player].forEach(t => {
                        totalEst += t.est;
                        totalAct += t.act;
                        if (t.act <= 0) missedActualLogs = true;
                    });

                    if (missedActualLogs) {
                        alert(`⚠️ ${player.toUpperCase()} left an Actual Mins field blank or 0! Please fill them to finish processing.`);
                        return;
                    }

                    let pointsGained = 1;
                    if (totalAct < totalEst) {
                        pointsGained += 1;
                        alert(`💥 CLOCK BEATEN! ${player.toUpperCase()} outpaced estimates! (+2 Total Points)`);
                    } else {
                        alert(`👍 Task completed cleanly for ${player.toUpperCase()}! (+1 Point)`);
                    }
                    state.scores[player] += pointsGained;
                } else {
                    state.scores[player] -= 1;
                    alert(`❌ ${player.toUpperCase()} missed tracking targets. (-1 Point)`);
                }

                state.todos[player] = []; 
            });

            saveState();
        }

        function updateDOM() {
            document.getElementById('score-mohamed').innerText = state.scores.mohamed;
            document.getElementById('score-moaz').innerText = state.scores.moaz;

            ['mohamed', 'moaz'].forEach(player => {
                
                // --- UPDATE STATS BAR ---
                let totalTasks = state.todos[player].length;
                let totalEstMins = 0;
                state.todos[player].forEach(t => totalEstMins += t.est);
                
                let hours = Math.floor(totalEstMins / 60);
                let mins = totalEstMins % 60;

                const statsEl = document.getElementById(`stats-${player}`);
                if (statsEl) {
                    statsEl.innerHTML = `
                        <span>Total Tasks: <strong>${totalTasks}</strong></span>
                        <span>Est Time: <strong>${hours}h ${mins}m</strong></span>
                    `;
                }
                // ------------------------

                const listEl = document.getElementById(`list-${player}`);
                if (!listEl) return;
                listEl.innerHTML = '';

                state.todos[player].forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.checked ? 'checked' : ''}`;
                    li.innerHTML = `
                        <div class="todo-info">
                            <span class="todo-text">${todo.task}</span>
                            <div class="time-tracking-row">
                                <span>⏱️ Est: <strong>${todo.est}m</strong></span>
                                <span>| Night Actual:</span>
                                <input type="number" 
                                       class="actual-input-box" 
                                       placeholder="Mins" 
                                       value="${todo.act || ''}" 
                                       oninput="updateActualTime('${player}', ${todo.id}, this.value)">
                            </div>
                        </div>
                        <div class="todo-actions">
                            <button class="checkbox-btn" onclick="toggleTodo('${player}', ${todo.id})">
                                ${todo.checked ? '↩️' : '✅'}
                            </button>
                            <button class="delete-btn" onclick="deleteTodo('${player}', ${todo.id})">🗑️</button>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            });
        }

        updateCountdown();
        updateDOM();
    </script>
</body>
</html>
