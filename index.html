<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED VS MOAZ: FINAL LAP</title>
    <style>
        :root {
            --bg-color: #0d0e15; --card-bg: #171926;
            --mohamed-color: #00f0ff; --moaz-color: #ff007f;
            --text-color: #f0f1f5; --countdown-color: #ff00ff;
            --success-color: #2ecc71; --danger-color: #e74c3c; --hoq-color: #9b59b6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; padding-bottom: 150px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* NAVIGATION & HEADER */
        header { text-align: center; margin-bottom: 20px; font-family: 'Impact', sans-serif; }
        h1 { font-size: 3.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .vs { font-style: italic; color: var(--countdown-color); }
        .nav-tabs { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .nav-tab { background: #222; border: 2px solid #555; padding: 10px 30px; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
        .nav-tab.active { background: var(--countdown-color); border-color: #fff; }

        .view-section { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; }
        #view-hoq { display: none; }

        /* LEADERBOARD */
        .leaderboard { background: var(--card-bg); border: 2px solid #333; padding: 20px; width: 100%; border-radius: 12px; margin-bottom: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .board-flex { display: flex; justify-content: space-around; align-items: center; font-size: 2.5rem; font-family: 'Impact'; margin-top: 15px; }
        .score-box { padding: 15px 30px; border-radius: 10px; min-width: 200px; }
        .score-box.mohamed { color: var(--mohamed-color); border: 2px solid var(--mohamed-color); }
        .score-box.moaz { color: var(--moaz-color); border: 2px solid var(--moaz-color); }

        /* ARENA & COLUMNS */
        .arena { display: flex; gap: 30px; width: 100%; flex-wrap: wrap; margin-bottom: 20px; }
        .player-column { flex: 1; min-width: 350px; background: var(--card-bg); border-radius: 15px; padding: 25px; border-top: 5px solid #555; }
        .player-column.mohamed { border-top-color: var(--mohamed-color); }
        .player-column.moaz { border-top-color: var(--moaz-color); }
        
        .todo-form, .wp-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select, textarea { background: #25283d; border: 1px solid #444; color: white; padding: 10px; font-size: 1rem; border-radius: 6px; width: 100%; }
        button.add-btn { background: #fff; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .mohamed .add-btn { background: var(--mohamed-color); }
        .moaz .add-btn { background: var(--moaz-color); }

        /* TASKS & WEAKPOINTS */
        .todo-item { background: #202231; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #555; display: flex; flex-direction: column; gap: 10px; }
        .todo-item.completed { border-left-color: var(--success-color); opacity: 0.7; }
        .task-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; }
        .task-controls { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #aaa; }
        .actual-input { width: 70px; padding: 5px; text-align: center; }
        .btn-group { display: flex; gap: 5px; }
        .icon-btn { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-done { background: var(--success-color); }
        .btn-del { background: var(--danger-color); }

        .wp-header { text-align: center; color: #ff3366; font-family: 'Impact'; font-size: 2rem; margin: 30px 0 15px; text-transform: uppercase; }

        /* HALL OF QUESTIONS */
        .hoq-upload-card { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; border: 2px dashed var(--hoq-color); margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }
        .input-box { position: relative; background: #11131c; border: 1px solid #444; border-radius: 8px; padding: 10px; }
        .input-box textarea { background: transparent; border: none; min-height: 80px; resize: vertical; outline: none; }
        .input-box .img-preview { display: none; max-height: 150px; margin-top: 10px; border-radius: 6px; }
        .input-box .remove-img { display: none; position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.8rem; }
        
        .upload-btn { background: var(--hoq-color); color: white; font-weight: bold; font-size: 1.2rem; padding: 15px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; }

        .hoq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; width: 100%; }
        .hoq-card { background: #202231; padding: 20px; border-radius: 10px; border: 1px solid #444; position: relative; }
        .hoq-card img { width: 100%; border-radius: 6px; margin-top: 10px; cursor: pointer; }
        .delete-hoq { position: absolute; top: 10px; right: 10px; background: var(--danger-color); border: none; color: white; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 0.8rem; }
        .answer-reveal { background: #111; padding: 10px; border-radius: 6px; margin-top: 10px; display: none; color: #00ffcc; white-space: pre-wrap; }
        .show-ans-btn { background: #444; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }

        /* WIDGETS */
        .widgets-container { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 15px; z-index: 1000; }
        .widget-btn { width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .widget-panel { position: absolute; bottom: 65px; left: 0; background: #fcf3cf; border: 2px solid #d4ac0d; border-radius: 12px; padding: 15px; color: #000; display: none; flex-direction: column; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .prayer-panel { background: #1a252c; border-color: #00ffcc; color: white; }
        .prayer-item { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #333; }
        .prayer-next { color: #00ffcc; font-weight: bold; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>Mohamed <span class="vs">VS</span> Moaz</h1>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="toggleView('arena')" id="tab-arena">The Arena</div>
            <div class="nav-tab" onclick="toggleView('hoq')" id="tab-hoq">Hall of Questions</div>
        </div>
    </header>

    <div id="view-arena" class="view-section">
        <section class="leaderboard">
            <h2 style="color: #ffd700; font-family: 'Impact'; letter-spacing: 2px;">🔥 OVERALL LEADERBOARD 🔥</h2>
            <div class="board-flex">
                <div class="score-box mohamed"><div>MOHAMED</div><div id="score-mohamed">0</div></div>
                <div class="score-box moaz"><div>MOAZ</div><div id="score-moaz">0</div></div>
            </div>
            <div style="margin-top: 15px; display: flex; justify-content: center; gap: 15px;">
                <button onclick="endTheDay()" style="background: #ffcc00; color: black; font-weight: bold; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer;">🚨 END DAY MANUALLY</button>
                <button onclick="resetAllData()" style="color: var(--danger-color); background: transparent; border: 1px solid var(--danger-color); padding: 10px; border-radius: 6px; cursor: pointer;">⚠️ Reset All Data</button>
            </div>
        </section>

        <main class="arena">
            <div class="player-column mohamed">
                <h2 style="color: var(--mohamed-color); margin-bottom: 15px; font-family: 'Impact';">MOHAMED</h2>
                <div class="todo-form">
                    <input type="text" id="mohamed-task" placeholder="Task name...">
                    <input type="number" id="mohamed-est" placeholder="Est Mins" style="width: 100px;">
                    <button class="add-btn" onclick="addTask('mohamed')">ADD</button>
                </div>
                <div id="list-mohamed"></div>
            </div>
            <div class="player-column moaz">
                <h2 style="color: var(--moaz-color); margin-bottom: 15px; font-family: 'Impact';">MOAZ</h2>
                <div class="todo-form">
                    <input type="text" id="moaz-task" placeholder="Task name...">
                    <input type="number" id="moaz-est" placeholder="Est Mins" style="width: 100px;">
                    <button class="add-btn" onclick="addTask('moaz')">ADD</button>
                </div>
                <div id="list-moaz"></div>
            </div>
        </main>

        <h2 class="wp-header">🎯 SIDE QUESTS (Weakpoints)</h2>
        <p style="text-align: center; color: #aaa; margin-bottom: 20px;">*Complete all main tasks before unlocking side quests.</p>
        <main class="arena">
            <div class="player-column mohamed">
                <div class="wp-input-group">
                    <select id="mohamed-wp-subj" style="width: 120px;"><option>Physics</option><option>Chem</option><option>Bio</option><option>Arabic</option></select>
                    <input type="text" id="mohamed-wp-task" placeholder="Weakpoint...">
                    <button class="add-btn" onclick="addWeakpoint('mohamed')">ADD</button>
                </div>
                <div id="wp-list-mohamed"></div>
            </div>
            <div class="player-column moaz">
                <div class="wp-input-group">
                    <select id="moaz-wp-subj" style="width: 120px;"><option>Physics</option><option>Chem</option><option>Bio</option><option>Arabic</option></select>
                    <input type="text" id="moaz-wp-task" placeholder="Weakpoint...">
                    <button class="add-btn" onclick="addWeakpoint('moaz')">ADD</button>
                </div>
                <div id="wp-list-moaz"></div>
            </div>
        </main>
    </div>

    <div id="view-hoq" class="view-section">
        <div class="hoq-upload-card">
            <h3 style="color:var(--hoq-color); text-align: center; text-transform: uppercase;">🏛️ Add to Hall of Questions</h3>
            
            <div class="input-box">
                <label style="color:#aaa; font-size:0.8rem; font-weight:bold;">QUESTION (Type or Paste Image)</label>
                <textarea id="hoq-q-text" placeholder="Type question or hit Ctrl+V to paste an image here..."></textarea>
                <button class="remove-img" id="rm-q" onclick="removeImage('q')">X</button>
                <img id="preview-q" class="img-preview">
            </div>

            <div class="input-box">
                <label style="color:#aaa; font-size:0.8rem; font-weight:bold;">ANSWER (Type or Paste Image)</label>
                <textarea id="hoq-a-text" placeholder="Type answer or hit Ctrl+V to paste an image here..."></textarea>
                <button class="remove-img" id="rm-a" onclick="removeImage('a')">X</button>
                <img id="preview-a" class="img-preview">
            </div>

            <button class="upload-btn" onclick="uploadQuestion()">🏛️ UPLOAD</button>
        </div>
        <div class="hoq-grid" id="hoq-grid"></div>
    </div>

    <div class="widgets-container">
        <div style="position: relative;">
            <div class="widget-panel" id="notepad-panel">
                <h4 style="margin-bottom: 10px;">📝 Scratchpad</h4>
                <textarea id="notepad-text" style="background: transparent; color: black; border: 1px solid #ccc; height: 200px; resize: none;"></textarea>
            </div>
            <button class="widget-btn" style="background: #f1c40f;" onclick="toggleWidget('notepad-panel')">📝</button>
        </div>
        
        <div style="position: relative;">
            <div class="widget-panel prayer-panel" id="prayer-panel">
                <h4 style="color: #00ffcc; text-align: center; margin-bottom: 10px;">🕌 Egypt Prayers</h4>
                <div id="prayer-times-list">Loading...</div>
                <div class="prayer-next" id="prayer-next-timer"></div>
            </div>
            <button class="widget-btn" style="background: #1a252c; color: #00ffcc;" onclick="toggleWidget('prayer-panel')">🕌</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDv8JBa9MtaTbCzNQ66HbAxB7YPBi_pGfQ",
            authDomain: "exam-3abc3.firebaseapp.com",
            databaseURL: "https://exam-3abc3-default-rtdb.firebaseio.com",
            projectId: "exam-3abc3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const stateRef = ref(db, 'hustleState');

        let localState = { 
            scores: { mohamed: 0, moaz: 0 }, 
            todos: { mohamed: [], moaz: [] }, 
            weakpoints: { mohamed: [], moaz: [] },
            hoq: [],
            lastResetDate: new Date().toDateString()
        };

        // IMAGE PASTE STATE
        let pendingImages = { q: null, a: null };

        onValue(stateRef, (snapshot) => {
            const data = snapshot.val();
            if (data) { 
                // Ensure new arrays exist if old database didn't have them
                if(!data.weakpoints) data.weakpoints = { mohamed: [], moaz: [] };
                localState = data; 
                updateDOM(); 
            }
        });

        // ================= VIEW & WIDGET TOGGLES =================
        window.toggleView = function(view) {
            document.getElementById('view-arena').style.display = view === 'arena' ? 'flex' : 'none';
            document.getElementById('view-hoq').style.display = view === 'hoq' ? 'flex' : 'none';
            document.getElementById('tab-arena').className = 'nav-tab ' + (view === 'arena' ? 'active' : '');
            document.getElementById('tab-hoq').className = 'nav-tab ' + (view === 'hoq' ? 'active' : '');
        };

        window.toggleWidget = function(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        };

        // ================= TASKS & WEAKPOINTS =================
        window.addTask = function(player) {
            const task = document.getElementById(`${player}-task`).value;
            const est = document.getElementById(`${player}-est`).value || 0;
            if(!task) return;
            localState.todos[player].push({ id: Date.now(), task, est, actual: "", completed: false });
            document.getElementById(`${player}-task`).value = '';
            document.getElementById(`${player}-est`).value = '';
            set(stateRef, localState);
        };

        window.addWeakpoint = function(player) {
            const task = document.getElementById(`${player}-wp-task`).value;
            const subj = document.getElementById(`${player}-wp-subj`).value;
            if(!task) return;
            localState.weakpoints[player].push({ id: Date.now(), task, subj, completed: false });
            document.getElementById(`${player}-wp-task`).value = '';
            set(stateRef, localState);
        };

        window.updateActual = function(player, id, value) {
            const t = localState.todos[player].find(x => x.id === id);
            if(t) t.actual = value;
            // No need to spam Firebase on every keystroke, let's just do it on blur
        };
        window.saveActual = function() { set(stateRef, localState); };

        window.toggleTask = function(player, id) {
            const t = localState.todos[player].find(x => x.id === id);
            if(t) { t.completed = !t.completed; set(stateRef, localState); }
        };

        window.deleteTask = function(player, id) {
            localState.todos[player] = localState.todos[player].filter(x => x.id !== id);
            set(stateRef, localState);
        };

        window.toggleWeakpoint = function(player, id) {
            // SIDE QUEST CONDITION: ALL MAIN TASKS MUST BE DONE
            const mainTasks = localState.todos[player];
            if(mainTasks.length === 0 || !mainTasks.every(t => t.completed)) {
                alert(`Bro, you gotta finish ALL your main tasks for today before doing side quests! Focus!`);
                return;
            }
            const wp = localState.weakpoints[player].find(x => x.id === id);
            if(wp) { wp.completed = !wp.completed; set(stateRef, localState); }
        };

        window.deleteWeakpoint = function(player, id) {
            localState.weakpoints[player] = localState.weakpoints[player].filter(x => x.id !== id);
            set(stateRef, localState);
        };

        // ================= HALL OF QUESTIONS =================
        function handlePaste(type) {
            return function(e) {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let index in items) {
                    const item = items[index];
                    if (item.kind === 'file') {
                        const blob = item.getAsFile();
                        const reader = new FileReader();
                        reader.onload = function(event) {
                            pendingImages[type] = event.target.result;
                            document.getElementById(`preview-${type}`).src = event.target.result;
                            document.getElementById(`preview-${type}`).style.display = 'block';
                            document.getElementById(`rm-${type}`).style.display = 'block';
                        };
                        reader.readAsDataURL(blob);
                    }
                }
            }
        }
        document.getElementById('hoq-q-text').addEventListener('paste', handlePaste('q'));
        document.getElementById('hoq-a-text').addEventListener('paste', handlePaste('a'));

        window.removeImage = function(type) {
            pendingImages[type] = null;
            document.getElementById(`preview-${type}`).style.display = 'none';
            document.getElementById(`rm-${type}`).style.display = 'none';
            document.getElementById(`preview-${type}`).src = '';
        };

        window.uploadQuestion = function() {
            const qText = document.getElementById('hoq-q-text').value;
            const aText = document.getElementById('hoq-a-text').value;
            
            if(!qText && !pendingImages.q) return alert("Bro, add a question at least.");

            localState.hoq.unshift({
                id: Date.now(),
                qText, qImg: pendingImages.q,
                aText, aImg: pendingImages.a
            });

            // Reset inputs
            document.getElementById('hoq-q-text').value = '';
            document.getElementById('hoq-a-text').value = '';
            removeImage('q'); removeImage('a');
            
            set(stateRef, localState);
        };

        window.deleteHoq = function(id) {
            if(confirm("Delete this question?")) {
                localState.hoq = localState.hoq.filter(q => q.id !== id);
                set(stateRef, localState);
            }
        };

        // ================= END DAY & RESET LOGIC =================
        window.endTheDay = function() {
            ['mohamed', 'moaz'].forEach(player => {
                let pts = 0;
                // Points for tasks
                localState.todos[player].forEach(t => {
                    if(t.completed) {
                        // Use actual mins if filled, else est mins. Convert to hours for points.
                        let mins = parseInt(t.actual) || parseInt(t.est) || 0;
                        pts += (mins / 60); 
                    }
                });
                // Bonus for weakpoints
                localState.weakpoints[player].forEach(w => {
                    if(w.completed) pts += 1; // Flat 1 point per weakpoint
                });
                
                localState.scores[player] += Math.round(pts * 10) / 10; // keep 1 decimal
            });

            // Wipe tasks
            localState.todos = { mohamed: [], moaz: [] };
            localState.weakpoints = { mohamed: [], moaz: [] };
            localState.lastResetDate = new Date().toDateString();
            
            set(stateRef, localState);
            alert("Day Ended! Points calculated and tasks cleared.");
        };

        // Automatic Midnight Reset
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                // To prevent multiple clients triggering it endlessly, check date
                if (localState.lastResetDate !== now.toDateString()) {
                    endTheDay();
                }
            }
        }, 60000); // Check every minute

        window.resetAllData = () => { 
            if(confirm("⚠️ WIPE EVERYTHING? SCORES TO ZERO?")) { 
                localState = { scores: { mohamed: 0, moaz: 0 }, todos: { mohamed: [], moaz: [] }, weakpoints: { mohamed: [], moaz: [] }, hoq: [], lastResetDate: new Date().toDateString() }; 
                set(stateRef, localState); 
            } 
        };

        // ================= DOM RENDERING =================
        function updateDOM() {
            document.getElementById('score-mohamed').innerText = localState.scores.mohamed;
            document.getElementById('score-moaz').innerText = localState.scores.moaz;
            
            const renderTasks = (player) => localState.todos[player].map(t => `
                <div class="todo-item ${t.completed ? 'completed' : ''}">
                    <div class="task-header">
                        <span>${t.task}</span>
                        <div class="btn-group">
                            <button class="icon-btn btn-done" onclick="toggleTask('${player}', ${t.id})">✔</button>
                            <button class="icon-btn btn-del" onclick="deleteTask('${player}', ${t.id})">🗑️</button>
                        </div>
                    </div>
                    <div class="task-controls">
                        ⏱️ Est: ${t.est}m | Actual: 
                        <input type="number" class="actual-input" value="${t.actual}" onchange="updateActual('${player}', ${t.id}, this.value)" onblur="saveActual()"> mins
                    </div>
                </div>
            `).join('');

            const renderWP = (player) => localState.weakpoints[player].map(w => `
                <div class="todo-item ${w.completed ? 'completed' : ''}" style="border-left-color: #ff3366;">
                    <div class="task-header">
                        <span style="font-size:0.9rem; color:#ff3366;">[${w.subj}]</span> ${w.task}
                        <div class="btn-group">
                            <button class="icon-btn btn-done" onclick="toggleWeakpoint('${player}', ${w.id})">✔</button>
                            <button class="icon-btn btn-del" onclick="deleteWeakpoint('${player}', ${w.id})">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.getElementById('list-mohamed').innerHTML = renderTasks('mohamed');
            document.getElementById('list-moaz').innerHTML = renderTasks('moaz');
            document.getElementById('wp-list-mohamed').innerHTML = renderWP('mohamed');
            document.getElementById('wp-list-moaz').innerHTML = renderWP('moaz');

            document.getElementById('hoq-grid').innerHTML = localState.hoq.map((q, i) => `
                <div class="hoq-card">
                    <button class="delete-hoq" onclick="deleteHoq(${q.id})">Delete</button>
                    <p><b>Q:</b> ${q.qText}</p>
                    ${q.qImg ? `<img src="${q.qImg}">` : ''}
                    
                    <button class="show-ans-btn" onclick="document.getElementById('ans-${i}').style.display='block'">Show Answer</button>
                    <div class="answer-reveal" id="ans-${i}">
                        <p>${q.aText}</p>
                        ${q.aImg ? `<img src="${q.aImg}">` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ================= NOTEPAD SYNC =================
        const npText = document.getElementById('notepad-text');
        npText.value = localStorage.getItem('local_notes') || '';
        npText.addEventListener('input', () => localStorage.setItem('local_notes', npText.value));

        // ================= PRAYER TIMES API (EGYPT) =================
        let prayerData = null;
        async function fetchPrayers() {
            try {
                // Aladhan API for Cairo
                const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5');
                const data = await res.json();
                const timings = data.data.timings;
                
                // Filter the ones we care about
                const required = ['Fajr', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'];
                prayerData = required.map(name => ({ name, time: timings[name] }));
                
                document.getElementById('prayer-times-list').innerHTML = prayerData.map(p => `
                    <div class="prayer-item"><span>${p.name}</span><span>${p.time}</span></div>
                `).join('');
                
                updateNextPrayer();
            } catch(e) {
                document.getElementById('prayer-times-list').innerHTML = "Could not load API.";
            }
        }

        function updateNextPrayer() {
            if(!prayerData) return;
            const now = new Date();
            const currMins = now.getHours() * 60 + now.getMinutes();
            
            let next = prayerData.find(p => {
                const [h, m] = p.time.split(':');
                return (parseInt(h) * 60 + parseInt(m)) > currMins;
            });
            
            if(!next) {
                // If all prayers done today, next is Fajr tomorrow
                document.getElementById('prayer-next-timer').innerText = `Next: Fajr (Tomorrow)`;
                return;
            }

            const [nH, nM] = next.time.split(':');
            let diffMins = (parseInt(nH) * 60 + parseInt(nM)) - currMins;
            let hrs = Math.floor(diffMins / 60);
            let mins = diffMins % 60;
            
            document.getElementById('prayer-next-timer').innerText = `Next: ${next.name} in ${hrs}h ${mins}m`;
        }

        fetchPrayers();
        setInterval(updateNextPrayer, 60000); // update timer every minute
    </script>
</body>
</html>
