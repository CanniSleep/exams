<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED VS MOAZ: THE FINAL LAP</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --mohamed-color: #45f3ff;
            --mohamed-glow: rgba(69, 243, 255, 0.4);
            --moaz-color: #ff007f;
            --moaz-glow: rgba(255, 0, 127, 0.4);
            --text-color: #c5c6c7;
            --heading-color: #66fcf1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 1px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 3.5rem;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .vs {
            background: linear-gradient(45deg, var(--mohamed-color), var(--moaz-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            padding: 0 10px;
        }

        /* COUNTDOWN PANEL */
        .countdown-panel {
            background: #141824;
            border: 2px solid var(--heading-color);
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
            text-align: center;
        }

        #main-timer-title {
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        #main-timer {
            font-size: 2.5rem;
            color: var(--heading-color);
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
            margin-bottom: 10px;
        }

        .expand-btn {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 5px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 0.8rem;
        }

        .other-exams {
            display: none;
            margin-top: 15px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            border-top: 1px dashed #333;
            padding-top: 15px;
        }

        .exam-mini-card {
            background: #0b0c10;
            padding: 10px;
            border-radius: 6px;
            font-family: sans-serif;
            font-size: 0.9rem;
        }
        .exam-mini-card h4 { font-family: 'Impact', sans-serif; color: #fff; }

        /* LEADERBOARD */
        .leaderboard {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .leaderboard h2 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 15px;
        }

        .scores-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 2.8rem;
        }

        .score-card {
            padding: 10px 25px;
            border-radius: 8px;
            background: #0b0c10;
        }
        .score-card.mohamed { border: 2px solid var(--mohamed-color); color: var(--mohamed-color); }
        .score-card.moaz { border: 2px solid var(--moaz-color); color: var(--moaz-color); }

        /* THE ARENA Grid Layout */
        .arena {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 900px;
        }

        @media (max-width: 768px) {
            .arena { grid-template-columns: 1fr; }
        }

        .player-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .player-box.mohamed { border-top: 6px solid var(--mohamed-color); }
        .player-box.moaz { border-top: 6px solid var(--moaz-color); }

        .player-box h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .mohamed h2 { color: var(--mohamed-color); }
        .moaz h2 { color: var(--moaz-color); }

        .section-title {
            font-family: sans-serif;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* INPUT BLOCK */
        .task-input-group {
            background: #141824;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .task-input-group label {
            font-family: sans-serif;
            font-size: 0.85rem;
            display: block;
            margin-bottom: 4px;
            color: #aaa;
        }

        .task-input-group input {
            width: 100%;
            background: #0b0c10;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-family: sans-serif;
            font-weight: bold;
        }

        .add-task-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        .mohamed .add-task-btn { background: var(--mohamed-color); color: #000; }
        .moaz .add-task-btn { background: var(--moaz-color); color: #fff; }

        /* LIST DISPLAY */
        .tasks-container {
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .task-row {
            background: #141824;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-main-info {
            font-family: sans-serif;
            font-weight: bold;
        }

        .task-title-text {
            display: block;
            font-family: 'Impact', sans-serif;
            font-size: 1.1rem;
            color: #fff;
        }

        .est-badge {
            font-size: 0.8rem;
            color: #888;
        }

        .status-toggle-btn {
            background: #2b2b2b;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        .status-toggle-btn.fail { background: #e74c3c; color: white; }
        .status-toggle-btn.pass { background: #2ecc71; color: white; }

        /* DAY END CALCULATIONS AREA */
        .day-evaluation-box {
            background: #141824;
            border: 2px dashed #ffcc00;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            margin-top: 35px;
            text-align: center;
        }

        .day-evaluation-box h3 {
            font-size: 1.8rem;
            color: #ffcc00;
            margin-bottom: 15px;
        }

        .total-inputs-flex {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .actual-hours-card {
            background: #0b0c10;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            min-width: 200px;
        }

        .actual-hours-card h5 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .actual-hours-card label {
            font-family: sans-serif;
            font-size: 0.8rem;
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }
        .actual-hours-card input {
            background: #1f2833;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            width: 80px;
            text-align: center;
            font-size: 1.1rem;
        }

        .call-day-btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .call-day-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        /* DAY SUMMARY POPUP BANNER */
        .battle-report {
            display: none;
            background: #0b0c10;
            border: 3px solid #fff;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            margin-top: 25px;
            padding: 20px;
            text-align: center;
        }

        .winner-banner {
            background: #2ecc71;
            color: #000;
            padding: 10px;
            font-size: 2rem;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            font-family: sans-serif;
            text-align: left;
        }

        .report-col {
            background: #141824;
            padding: 15px;
            border-radius: 8px;
        }
        .report-col h4 { font-family: 'Impact', sans-serif; font-size: 1.5rem; margin-bottom: 10px; }
        .outcome-badge {
            font-family: 'Impact', sans-serif;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
        }
        .outcome-badge.win { background: #2ecc71; color: #000; }
        .outcome-badge.lose { background: #e74c3c; color: #fff; }
    </style>
</head>

                <div id="score-moaz">0</div>
            </div>
        </div>
    </section>
