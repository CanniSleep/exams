<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED VS MOAZ: FINAL LAP</title>
    <style>
        :root {
            --bg-color: #0d0e15; --card-bg: #171926;
            --mohamed-color: #00f0ff; --moaz-color: #ff007f;
            --text-color: #f0f1f5; --countdown-color: #ff00ff;
            --success-color: #2ecc71; --danger-color: #e74c3c; 
            --hoq-color: #9b59b6; --book-color: #f39c12; --qotd-color: #ff3366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; padding-bottom: 150px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* HEADER */
        header { text-align: center; margin-bottom: 20px; font-family: 'Impact', sans-serif; }
        h1 { font-size: 3.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .vs { font-style: italic; color: var(--countdown-color); }
        .nav-tabs { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-tab { background: #222; border: 2px solid #555; padding: 10px 25px; font-weight: bold; cursor: pointer; border-radius: 8px; text-transform: uppercase; transition: 0.3s; }
        .nav-tab.active { background: var(--countdown-color); border-color: #fff; }
        #tab-books.active { background: var(--book-color); }

        .view-section { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; }
        #view-hoq, #view-books { display: none; }

        /* QOTD */
        .qotd-container { background: var(--card-bg); border: 2px solid var(--qotd-color); border-radius: 12px; width: 100%; padding: 20px; margin-bottom: 30px; text-align: center; }
        .qotd-container h2 { color: var(--qotd-color); font-family: 'Impact'; margin-bottom: 15px; }
        .qotd-content img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 10px; }
        .qotd-edit { display: none; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px; }

        /* LEADERBOARD & ARENA */
        .leaderboard { background: var(--card-bg); border: 2px solid #333; padding: 20px; width: 100%; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .board-flex { display: flex; justify-content: space-around; align-items: center; font-size: 2.5rem; font-family: 'Impact'; margin-top: 15px; }
        .score-box { padding: 15px 30px; border-radius: 10px; min-width: 200px; }
        .score-box.mohamed { color: var(--mohamed-color); border: 2px solid var(--mohamed-color); }
        .score-box.moaz { color: var(--moaz-color); border: 2px solid var(--moaz-color); }

        .arena { display: flex; gap: 30px; width: 100%; flex-wrap: wrap; margin-bottom: 20px; }
        .player-column { flex: 1; min-width: 350px; background: var(--card-bg); border-radius: 15px; padding: 25px; border-top: 5px solid #555; }
        .player-column.mohamed { border-top-color: var(--mohamed-color); }
        .player-column.moaz { border-top-color: var(--moaz-color); }
        
        .todo-form, .wp-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input, select, textarea { background: #25283d; border: 1px solid #444; color: white; padding: 10px; font-size: 1rem; border-radius: 6px; width: 100%; }
        button.add-btn { background: #fff; color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .mohamed .add-btn { background: var(--mohamed-color); }
        .moaz .add-btn { background: var(--moaz-color); }

        /* TASKS */
        .todo-item { background: #202231; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #555; display: flex; flex-direction: column; gap: 10px; }
        .todo-item.completed { border-left-color: var(--success-color); opacity: 0.7; }
        .task-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; }
        .task-controls { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #aaa; }
        .actual-input { width: 70px; padding: 5px; text-align: center; }
        .btn-group { display: flex; gap: 5px; }
        .icon-btn { border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-done { background: var(--success-color); }
        .btn-del { background: var(--danger-color); }

        .wp-header { text-align: center; color: #ff3366; font-family: 'Impact'; font-size: 2rem; margin: 30px 0 15px; text-transform: uppercase; }

        /* HALL & BOOKS */
        .input-box { position: relative; background: #11131c; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: left; }
        .input-box textarea { background: transparent; border: none; min-height: 60px; resize: vertical; outline: none; width: 100%; color: white; }
        .img-preview { display: none; max-height: 150px; margin-top: 10px; border-radius: 6px; }
        .remove-img { display: none; position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.8rem; }
        .upload-btn { background: var(--hoq-color); color: white; font-weight: bold; font-size: 1.2rem; padding: 15px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; }
        .hoq-upload-card { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; border: 2px dashed var(--hoq-color); margin-bottom: 30px; }
        .hoq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; width: 100%; }
        .hoq-card { background: #202231; padding: 20px; border-radius: 10px; border: 1px solid #444; position: relative; }
        .hoq-card img { width: 100%; border-radius: 6px; margin-top: 10px; cursor: pointer; }
        .delete-btn-corner { position: absolute; top: 10px; right: 10px; background: var(--danger-color); border: none; color: white; border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 0.8rem; z-index: 10; }
        .answer-reveal { background: #111; padding: 10px; border-radius: 6px; margin-top: 10px; display: none; color: #00ffcc; white-space: pre-wrap; }
        .show-ans-btn { background: #444; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }

        .book-upload-card { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 100%; border: 2px dashed var(--book-color); margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; width: 100%; }
        .book-card { background: #25283d; padding: 20px; border-radius: 8px; text-align: center; position: relative; border-bottom: 4px solid var(--book-color); display: flex; flex-direction: column; justify-content: space-between; height: 160px; }
        .book-card h3 { font-size: 1.1rem; margin-bottom: 10px; color: white; word-wrap: break-word; }
        .book-btn { background: var(--book-color); color: black; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: bold; display: inline-block; width: 100%; }

        /* WIDGETS */
        .widgets-container { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 15px; z-index: 1000; }
        .widget-btn { width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; }
        .widget-panel { position: absolute; bottom: 65px; left: 0; background: #fcf3cf; border: 2px solid #d4ac0d; border-radius: 12px; padding: 15px; color: #000; display: none; flex-direction: column; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .prayer-panel { background: #1a252c; border-color: #00ffcc; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Mohamed <span class="vs">VS</span> Moaz</h1>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="toggleView('arena')" id="tab-arena">The Arena</div>
            <div class="nav-tab" onclick="toggleView('hoq')" id="tab-hoq">Hall of Questions</div>
            <div class="nav-tab" onclick="toggleView('books')" id="tab-books">كتب خارجية</div>
        </div>
    </header>

    <div id="view-arena" class="view-section">
        <div class="qotd-container">
            <h2>⭐ QUESTION OF THE DAY ⭐</h2>
            <div id="qotd-display" class="qotd-content">
                <p id="qotd-text-display">Loading QOTD...</p>
                <img id="qotd-img-display" style="display:none;">
                <button class="show-ans-btn" style="width: auto; padding: 5px 15px; margin-top: 15px;" onclick="document.getElementById('qotd-ans-display').style.display='block'">Reveal Answer</button>
                <div class="answer-reveal" id="qotd-ans-display">
                    <p id="qotd-atext-display"></p>
                    <img id="qotd-aimg-display" style="display:none;">
                </div>
            </div>
            <button onclick="document.getElementById('qotd-edit-panel').style.display='block'" style="background:transparent; color:#aaa; border:1px solid #555; padding:5px 10px; border-radius:4px; margin-top:15px; cursor:pointer; font-size:0.8rem;">Change QOTD</button>
            <div class="qotd-edit" id="qotd-edit-panel">
                <div class="input-box">
                    <textarea id="qotd-q-input" placeholder="Paste image (Ctrl+V) or type here..."></textarea>
                    <img id="preview-qotd-q" class="img-preview">
                </div>
                <div class="input-box">
                    <textarea id="qotd-a-input" placeholder="Paste image (Ctrl+V) or type here..."></textarea>
                    <img id="preview-qotd-a" class="img-preview">
                </div>
                <button class="upload-btn" style="background: var(--qotd-color);" onclick="updateQOTD()">Update QOTD</button>
            </div>
        </div>

        <section class="leaderboard">
            <div class="board-flex">
                <div class="score-box mohamed"><div>MOHAMED</div><div id="score-mohamed">0</div></div>
                <div class="score-box moaz"><div>MOAZ</div><div id="score-moaz">0</div></div>
            </div>
            <div style="margin-top: 15px;"><button onclick="endTheDay()" style="background: #ffcc00; color: black; font-weight: bold; padding: 10px 20px; border: none; cursor: pointer;">🚨 END DAY MANUALLY</button></div>
        </section>

        <main class="arena">
            <div class="player-column mohamed">
                <h2 style="color: var(--mohamed-color);">MOHAMED</h2>
                <div class="todo-form">
                    <input type="text" id="mohamed-task" placeholder="Task...">
                    <input type="number" id="mohamed-est" placeholder="Mins" style="width: 80px;">
                    <button class="add-btn" onclick="addTask('mohamed')">ADD</button>
                </div>
                <div id="list-mohamed"></div>
            </div>
            <div class="player-column moaz">
                <h2 style="color: var(--moaz-color);">MOAZ</h2>
                <div class="todo-form">
                    <input type="text" id="moaz-task" placeholder="Task...">
                    <input type="number" id="moaz-est" placeholder="Mins" style="width: 80px;">
                    <button class="add-btn" onclick="addTask('moaz')">ADD</button>
                </div>
                <div id="list-moaz"></div>
            </div>
        </main>

        <h2 class="wp-header">🎯 SIDE QUESTS</h2>
        <main class="arena">
            <div class="player-column mohamed">
                <div class="wp-input-group">
                    <select id="mohamed-wp-subj"><option>Physics</option><option>Chem</option><option>Bio</option><option>Arabic</option></select>
                    <input type="text" id="mohamed-wp-task" placeholder="Weakpoint...">
                    <button class="add-btn" onclick="addWeakpoint('mohamed')">ADD</button>
                </div>
                <div id="wp-list-mohamed"></div>
            </div>
            <div class="player-column moaz">
                <div class="wp-input-group">
                    <select id="moaz-wp-subj"><option>Physics</option><option>Chem</option><option>Bio</option><option>Arabic</option></select>
                    <input type="text" id="moaz-wp-task" placeholder="Weakpoint...">
                    <button class="add-btn" onclick="addWeakpoint('moaz')">ADD</button>
                </div>
                <div id="wp-list-moaz"></div>
            </div>
        </main>
    </div>

    <div id="view-hoq" class="view-section">
        <div class="hoq-upload-card">
            <h3 style="color:var(--hoq-color); text-align:center;">🏛️ ADD TO HALL</h3>
            <div class="input-box"><textarea id="hoq-q-text" placeholder="Question..."></textarea></div>
            <div class="input-box"><textarea id="hoq-a-text" placeholder="Answer..."></textarea></div>
            <button class="upload-btn" onclick="uploadQuestion()">UPLOAD</button>
        </div>
        <div class="hoq-grid" id="hoq-grid"></div>
    </div>

    <div id="view-books" class="view-section">
        <div class="book-upload-card">
            <h3 style="color:var(--book-color);">📚 LINK EXTERNAL BOOKS</h3>
            <div style="display: flex; gap: 10px; width: 100%; max-width: 600px;">
                <input type="text" id="book-title-input" placeholder="Title..." style="flex: 1;">
                <input type="text" id="book-url-input" placeholder="Link..." style="flex: 2;">
            </div>
            <button class="upload-btn" style="background: var(--book-color);" onclick="addBookLink()">SAVE LINK</button>
        </div>
        <div class="book-grid" id="book-grid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({
            apiKey: "AIzaSyDv8JBa9MtaTbCzNQ66HbAxB7YPBi_pGfQ",
            databaseURL: "https://exam-3abc3-default-rtdb.firebaseio.com",
            projectId: "exam-3abc3"
        });
        const db = getDatabase(app);
        const stateRef = ref(db, 'hustleState');
        let localState = null;

        onValue(stateRef, (snapshot) => {
            const data = snapshot.val();
            // ONLY update if data changed significantly to prevent UI thrashing
            if(JSON.stringify(localState) !== JSON.stringify(data)) {
                localState = data || { scores: {mohamed:0, moaz:0}, todos: {mohamed:[], moaz:[]}, weakpoints: {mohamed:[], moaz:[]}, hoq:[], books:[], qotd:{qText:"..."} };
                updateDOM();
            }
        });

        window.toggleView = (v) => {
            ['arena', 'hoq', 'books'].forEach(s => document.getElementById('view-'+s).style.display = (v === s ? 'flex' : 'none'));
        };

        window.addTask = (p) => {
            const t = document.getElementById(p+'-task').value;
            if(!t) return;
            localState.todos[p].push({ id: Date.now(), task: t, est: document.getElementById(p+'-est').value, actual: "", completed: false });
            set(stateRef, localState);
        };

        window.addWeakpoint = (p) => {
            const t = document.getElementById(p+'-wp-task').value;
            if(!t) return;
            localState.weakpoints[p].push({ id: Date.now(), task: t, subj: document.getElementById(p+'-wp-subj').value, completed: false });
            set(stateRef, localState);
        };

        window.toggleTask = (p, id) => {
            const t = localState.todos[p].find(x => x.id === id);
            if(t) { t.completed = !t.completed; set(stateRef, localState); }
        };

        window.deleteTask = (p, id) => {
            localState.todos[p] = localState.todos[p].filter(x => x.id !== id);
            set(stateRef, localState);
        };

        window.toggleWeakpoint = (p, id) => {
            // REMOVED: The check that blocks if main tasks aren't done. Now just toggle.
            const wp = localState.weakpoints[p].find(x => x.id === id);
            if(wp) { wp.completed = !wp.completed; set(stateRef, localState); }
        };

        window.deleteWeakpoint = (p, id) => {
            localState.weakpoints[p] = localState.weakpoints[p].filter(x => x.id !== id);
            set(stateRef, localState);
        };

        window.updateActual = (p, id, val) => {
            const t = localState.todos[p].find(x => x.id === id);
            if(t) { t.actual = val; set(stateRef, localState); }
        };

        window.uploadQuestion = () => {
            localState.hoq.unshift({ id: Date.now(), qText: document.getElementById('hoq-q-text').value, aText: document.getElementById('hoq-a-text').value });
            set(stateRef, localState);
        };

        window.deleteHoq = (id) => {
            localState.hoq = localState.hoq.filter(x => x.id !== id);
            set(stateRef, localState);
        };

        window.addBookLink = () => {
            localState.books.unshift({ id: Date.now(), title: document.getElementById('book-title-input').value, url: document.getElementById('book-url-input').value });
            set(stateRef, localState);
        };

        window.deleteBook = (id) => {
            localState.books = localState.books.filter(x => x.id !== id);
            set(stateRef, localState);
        };

        window.endTheDay = () => {
            ['mohamed', 'moaz'].forEach(p => {
                localState.todos[p].forEach(t => { if(t.completed) localState.scores[p] += (parseInt(t.actual) || 0)/60; });
            });
            localState.todos = { mohamed: [], moaz: [] };
            localState.weakpoints = { mohamed: [], moaz: [] };
            set(stateRef, localState);
        };

        function updateDOM() {
            if(!localState) return;
            document.getElementById('score-mohamed').innerText = Math.round(localState.scores.mohamed);
            document.getElementById('score-moaz').innerText = Math.round(localState.scores.moaz);
            
            // Render Tasks & WPs logic included here (simplified for brevity)
            renderList('mohamed'); renderList('moaz');
        }

        function renderList(p) {
            document.getElementById('list-'+p).innerHTML = localState.todos[p].map(t => `<div class="todo-item ${t.completed?'completed':''}"><div class="task-header"><span>${t.task}</span><button onclick="deleteTask('${p}', ${t.id})">🗑️</button></div><input class="actual-input" value="${t.actual}" onchange="updateActual('${p}', ${t.id}, this.value)"></div>`).join('');
            document.getElementById('wp-list-'+p).innerHTML = localState.weakpoints[p].map(w => `<div class="todo-item ${w.completed?'completed':''}"><div class="task-header"><span style="color:#ff3366">[${w.subj}]</span> <span>${w.task}</span><button onclick="deleteWeakpoint('${p}', ${w.id})">🗑️</button></div></div>`).join('');
        }
    </script>
</body>
</html>
