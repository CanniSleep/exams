<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHAMED VS MOAZ: FINAL LAP</title>
    <style>
        :root {
            --bg-color: #0d0e15; --card-bg: #171926;
            --mohamed-color: #00f0ff; --mohamed-glow: rgba(0, 240, 255, 0.4);
            --moaz-color: #ff007f; --moaz-glow: rgba(255, 0, 127, 0.4);
            --text-color: #f0f1f5; --countdown-color: #ff00ff;
            --success-color: #2ecc71; --danger-color: #e74c3c; --hoq-color: #9b59b6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: 1px; }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            padding: 20px; padding-bottom: 150px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* NAVIGATION */
        .nav-tabs { display: flex; gap: 20px; margin-bottom: 30px; }
        .nav-tab {
            background: #222; color: #fff; border: 2px solid #555; padding: 12px 40px; font-size: 1.2rem;
            border-radius: 8px; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }
        .nav-tab.active { background: var(--countdown-color); border-color: #fff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }

        .view-section { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; }
        #view-hoq { display: none; }

        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 4rem; text-transform: uppercase; margin-bottom: 10px; }
        .vs { font-style: italic; color: var(--countdown-color); padding: 0 10px; }

        /* ARENA */
        .leaderboard { background: var(--card-bg); border: 2px solid #333; padding: 30px; width: 100%; border-radius: 12px; margin-bottom: 40px; text-align: center; }
        .board-flex { display: flex; justify-content: space-around; align-items: center; font-size: 3rem; margin-bottom: 20px; }
        .score-box { padding: 20px 40px; border-radius: 10px; }
        .score-box.mohamed { color: var(--mohamed-color); border: 2px solid var(--mohamed-color); }
        .score-box.moaz { color: var(--moaz-color); border: 2px solid var(--moaz-color); }

        .arena { display: flex; gap: 40px; width: 100%; flex-wrap: wrap; }
        .player-column { flex: 1; min-width: 400px; background: var(--card-bg); border-radius: 15px; padding: 30px; }
        
        input, select, textarea { background: #25283d; border: 2px solid #444; color: white; padding: 15px; font-size: 1.1rem; border-radius: 6px; width: 100%; margin-bottom: 10px; }
        button { padding: 15px 30px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        
        .todo-item { background: #202231; padding: 20px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

        /* HALL OF QUESTIONS */
        .hoq-upload-card { background: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; border: 2px dashed var(--hoq-color); margin-bottom: 30px; }
        .hoq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 20px; width: 100%; }
        .hoq-card { background: #202231; padding: 20px; border-radius: 10px; border: 1px solid #444; }
        .hoq-card img { width: 100%; height: auto; border-radius: 6px; margin-bottom: 10px; }

        /* WIDGETS */
        .widgets-container { position: fixed; bottom: 20px; left: 20px; display: flex; gap: 20px; z-index: 1000; }
        .notepad-panel { background: #fcf3cf; border-radius: 12px; width: 300px; height: 300px; padding: 15px; display: none; flex-direction: column; }
        .stopwatch-widget { background: #171926; padding: 20px; border-radius: 12px; border: 2px solid #555; }
    </style>
</head>
<body>

    <header>
        <h1>Mohamed <span class="vs">VS</span> Moaz</h1>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="toggleView('arena')" id="tab-arena">The Arena</div>
            <div class="nav-tab" onclick="toggleView('hoq')" id="tab-hoq">Hall of Questions</div>
        </div>
    </header>

    <div id="view-arena" class="view-section">
        <section class="leaderboard">
            <h2>🔥 LEADERBOARD 🔥</h2>
            <div class="board-flex">
                <div class="score-box mohamed"><div>MOHAMED</div><div id="score-mohamed">0</div></div>
                <div class="score-box moaz"><div>MOAZ</div><div id="score-moaz">0</div></div>
            </div>
            <button class="reset-btn" onclick="resetAllData()" style="color: #e74c3c; background: transparent; border: 1px solid #e74c3c;">⚠️ Reset Data</button>
        </section>

        <main class="arena">
            <div class="player-column mohamed">
                <h2>Mohamed</h2>
                <div class="todo-form">
                    <input type="text" id="input-mohamed-task" placeholder="Task name...">
                    <input type="number" id="input-mohamed-est" placeholder="Est. Hrs">
                    <button onclick="addTodo('mohamed')" style="background: var(--mohamed-color);">ADD</button>
                </div>
                <ul id="list-mohamed" style="list-style:none;"></ul>
            </div>
            <div class="player-column moaz">
                <h2>Moaz</h2>
                <div class="todo-form">
                    <input type="text" id="input-moaz-task" placeholder="Task name...">
                    <input type="number" id="input-moaz-est" placeholder="Est. Hrs">
                    <button onclick="addTodo('moaz')" style="background: var(--moaz-color);">ADD</button>
                </div>
                <ul id="list-moaz" style="list-style:none;"></ul>
            </div>
        </main>
    </div>

    <div id="view-hoq" class="view-section">
        <div class="hoq-upload-card">
            <h3 style="color:var(--hoq-color); margin-bottom: 10px;">📤 Upload (MCQ / Essay)</h3>
            <input type="file" id="hoq-q-file" accept="image/*">
            <textarea id="hoq-answer-input" placeholder="Enter answer/solution text..."></textarea>
            <button class="upload-btn" onclick="uploadQuestion()" style="background: var(--hoq-color);">UPLOAD TO HALL</button>
        </div>
        <div class="hoq-grid" id="hoq-grid"></div>
    </div>

    <div class="widgets-container">
        <div class="notepad-wrapper">
            <div class="notepad-panel" id="notepad-panel"><textarea id="notepad-text"></textarea></div>
            <button onclick="document.getElementById('notepad-panel').style.display = document.getElementById('notepad-panel').style.display === 'flex' ? 'none' : 'flex'">📝</button>
        </div>
        <div class="stopwatch-widget">
            <div id="sw-display" style="font-size: 2rem;">00:00:00</div>
            <button onclick="startTimer()">▶</button><button onclick="resetTimer()">↺</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDv8JBa9MtaTbCzNQ66HbAxB7YPBi_pGfQ",
            authDomain: "exam-3abc3.firebaseapp.com",
            databaseURL: "https://exam-3abc3-default-rtdb.firebaseio.com",
            projectId: "exam-3abc3",
            storageBucket: "exam-3abc3.firebasestorage.app",
            messagingSenderId: "93565862046",
            appId: "1:93565862046:web:a905f5044a9d19957dbb8f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const stateRef = ref(db, 'hustleState');

        let localState = { scores: { mohamed: 0, moaz: 0 }, todos: { mohamed: [], moaz: [] }, hoq: [] };

        onValue(stateRef, (snapshot) => {
            const data = snapshot.val();
            if (data) { localState = data; updateDOM(); }
        });

        window.toggleView = function(view) {
            document.getElementById('view-arena').style.display = view === 'arena' ? 'flex' : 'none';
            document.getElementById('view-hoq').style.display = view === 'hoq' ? 'flex' : 'none';
        };

        window.addTodo = function(player) {
            const task = document.getElementById(`input-${player}-task`).value;
            const est = document.getElementById(`input-${player}-est`).value;
            if(!task) return;
            localState.todos[player].push({ id: Date.now(), task, est });
            set(stateRef, localState);
        };

        window.uploadQuestion = function() {
            const fileInput = document.getElementById('hoq-q-file');
            const ans = document.getElementById('hoq-answer-input').value;
            if(!fileInput.files[0]) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                localState.hoq.unshift({ id: Date.now(), image: e.target.result, answer: ans });
                set(stateRef, localState);
            };
            reader.readAsDataURL(fileInput.files[0]);
        };

        function updateDOM() {
            document.getElementById('score-mohamed').innerText = localState.scores.mohamed;
            document.getElementById('score-moaz').innerText = localState.scores.moaz;
            
            const hoqGrid = document.getElementById('hoq-grid');
            hoqGrid.innerHTML = localState.hoq.map(q => `
                <div class="hoq-card">
                    <img src="${q.image}">
                    <p style="margin-bottom:10px;">${q.answer}</p>
                </div>
            `).join('');
        }
        
        window.resetAllData = () => { if(confirm("Reset all?")) { localState = { scores: { mohamed: 0, moaz: 0 }, todos: { mohamed: [], moaz: [] }, hoq: [] }; set(stateRef, localState); } };
    </script>
</body>
</html>
